[project]
name = "songdetect"
version = "1.0.0"
description = "Worldwide Song Identification from Middle Snippets & Human Singing"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "shazamio>=0.8.0",
    "imageio-ffmpeg>=0.5.0",
    "pydub>=0.25.1",
    "aiofiles>=23.2.1",
    "SpeechRecognition>=3.14.0",
    "aiohttp>=3.9.0"
]

[tool.vercel]
entrypoint = "backend.app:app"
